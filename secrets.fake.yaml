# secrets.fake.yaml - committed for CI to consume so `ha core check` passes.
# Real values live in /config/secrets.yaml (gitignored). Frenck pattern.
#
# Any `!secret foo` reference in this repo's YAML must have a matching key here.
# CI substitutes this file in place of secrets.yaml, runs `ha core check`, and
# fails if HA can't load the config.

# HA admin
HA_ADMIN_TOKEN: "fake_token_for_ci_only_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

# Mesh services
MESH_TOKEN: "fake_mesh_token_aaaaaaaaaaaaaaaaaaaaaaaaaaaa"
MESH_BRIDGE_URL: "http://mesh-bridge:6500"
MESH_COUNCIL_URL: "http://council:8800"
MESH_KNOWLEDGE_URL: "http://knowledge:5850"
MESH_VISION_URL: "http://vision:6600"
MESH_ARIA_URL: "http://aria:5050"
MESH_SCENE_URL: "http://scene:5555"
MESH_ROUTINE_URL: "http://routine:5500"
MESH_SENTIMENT_URL: "http://sentiment:5800"
MESH_MEMORY_URL: "http://memory:5950"
MESH_GENESIS_URL: "http://genesis:6400"

# MQTT
MQTT_HOST: "192.0.2.1"
MQTT_USER: "ha_fake"
MQTT_PASS: "fake_mqtt_password"
