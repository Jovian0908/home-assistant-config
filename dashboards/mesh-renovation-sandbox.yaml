# mesh-renovation-sandbox.yaml - the AM5 sandbox killer dashboard.
# 2026-05-08 rebuild: surfaces 28 mesh REST sensors + 5 control scripts.
#
# 4 views: Brain (live status) | Audit (what's been learned) | Control | System

title: Mesh AI
views:
  # ============================================================
  - title: Brain
    path: brain
    icon: mdi:brain
    type: sections
    max_columns: 3
    sections:
      # ----- Hero: live scene narrative + brain health -----
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: "Mesh brain"
            secondary: "{{ states('sensor.mesh_brain') }} services alive · {{ state_attr('sensor.mesh_brain','health_pct') }}% healthy"
            icon: mdi:brain
            icon_color: |
              {% set p = state_attr('sensor.mesh_brain','health_pct') | int(0) %}
              {% if p >= 100 %}green{% elif p >= 60 %}amber{% else %}red{% endif %}
            entity: sensor.mesh_brain
            fill_container: true
            multiline_secondary: true
            tap_action:
              action: navigate
              navigation_path: /mesh-renovation/audit
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(76,175,80,0.15), rgba(33,150,243,0.10)) !important;
                  border: 1px solid rgba(76,175,80,0.3);
                }
          - type: custom:mushroom-template-card
            primary: "Activity tier"
            secondary: "{{ states('sensor.mesh_activity_tier') | title }}"
            icon: mdi:account-clock
            icon_color: |
              {% set t = states('sensor.mesh_activity_tier') %}
              {% if t == 'active' %}green
              {% elif t == 'quiet' %}blue
              {% elif t == 'idle' %}orange
              {% else %}grey{% endif %}
            entity: sensor.mesh_activity_tier
            fill_container: true
          - type: custom:mushroom-template-card
            primary: "Anomalies"
            secondary: "{{ states('sensor.mesh_scene_anomalies') }} unack · tap to review"
            icon: mdi:alert-decagram
            icon_color: "{{ 'red' if states('sensor.mesh_scene_anomalies') | int(0) > 10 else 'amber' if states('sensor.mesh_scene_anomalies') | int(0) > 0 else 'green' }}"
            entity: sensor.mesh_scene_anomalies
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: /mesh-renovation/audit
          - type: markdown
            content: >
              ### Live scene narrative

              {{ state_attr('sensor.mesh_scene_narrative','last_scene') or '_(no narrative yet)_' }}

              ---

              _Updated {{ relative_time(state_attr('sensor.mesh_scene_narrative','last_scene_updated') | as_datetime) if state_attr('sensor.mesh_scene_narrative','last_scene_updated') else 'never' }}_
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(180deg, rgba(63,81,181,0.08), rgba(63,81,181,0.02)) !important;
                  border-left: 3px solid #3F51B5;
                }

      # ----- Service grid: 6 mesh brains -----
      - type: grid
        cards:
          - type: heading
            heading: AI services
            icon: mdi:graph-outline
          - type: custom:mushroom-template-card
            primary: "Council"
            secondary: "{{ states('sensor.mesh_council_queries') }} queries · {{ states('sensor.mesh_council_cache_hit_ratio') }}% cache"
            icon: mdi:account-supervisor
            icon_color: "{{ 'green' if is_state('binary_sensor.mesh_council_alive','on') else 'red' }}"
            entity: sensor.mesh_council_status
          - type: custom:mushroom-template-card
            primary: "Knowledge"
            secondary: "{{ states('sensor.mesh_knowledge_chunks') }} chunks · {{ states('sensor.mesh_knowledge_files') }} files"
            icon: mdi:database
            icon_color: "{{ 'green' if is_state('binary_sensor.mesh_knowledge_alive','on') else 'red' }}"
            entity: sensor.mesh_knowledge_chunks
          - type: custom:mushroom-template-card
            primary: "Vision"
            secondary: "{{ states('sensor.mesh_vision_events') }} events · {{ states('sensor.mesh_vision_llava_calls') }} llava calls"
            icon: mdi:eye
            icon_color: "{{ 'green' if is_state('binary_sensor.mesh_vision_alive','on') else 'red' }}"
            entity: sensor.mesh_vision_events
          - type: custom:mushroom-template-card
            primary: "Scene"
            secondary: "{{ states('sensor.mesh_scene_events_today') }} today · {{ states('sensor.mesh_scene_routines_learned') }} routines"
            icon: mdi:scene
            icon_color: "{{ 'green' if is_state('binary_sensor.mesh_scene_alive','on') else 'red' }}"
            entity: sensor.mesh_scene_events_today
          - type: custom:mushroom-template-card
            primary: "Memory"
            secondary: "{{ states('sensor.mesh_memory_status') | title }}"
            icon: mdi:memory
            icon_color: "{{ 'green' if is_state('binary_sensor.mesh_memory_alive','on') else 'red' }}"
            entity: sensor.mesh_memory_status
          - type: custom:mushroom-template-card
            primary: "Genesis"
            secondary: "{{ states('sensor.mesh_genesis_capacity') }} pipelines"
            icon: mdi:dna
            icon_color: "{{ 'green' if is_state('binary_sensor.mesh_genesis_alive','on') else 'red' }}"
            entity: sensor.mesh_genesis_capacity

      # ----- Vision detail: enrolled faces -----
      - type: grid
        cards:
          - type: heading
            heading: Enrolled faces
            icon: mdi:face-recognition
          - type: markdown
            content: >
              {% set faces = state_attr('sensor.mesh_vision_faces_enrolled','enrolled') %}
              {% if faces %}
              **{{ faces | length }} enrolled:** {{ faces | join(' · ') | title }}

              **Cameras seen:** {{ state_attr('sensor.mesh_vision_events','cameras') | join(', ') }}

              **Model:** `{{ state_attr('sensor.mesh_vision_events','model') }}` · {{ state_attr('sensor.mesh_vision_events','llava_errors') }} errors total
              {% else %}
              _(no faces enrolled yet)_
              {% endif %}

  # ============================================================
  - title: Audit
    path: audit
    icon: mdi:clipboard-list
    type: sections
    max_columns: 2
    sections:
      # ----- Anomalies (most actionable) -----
      - type: grid
        cards:
          - type: heading
            heading: "Anomalies to review ({{ states('sensor.mesh_scene_anomalies') }} unack)"
            icon: mdi:alert-decagram
          - type: markdown
            content: >
              {% set items = state_attr('sensor.mesh_scene_anomalies','items') or [] %}
              {% set unack = items | rejectattr('acknowledged','equalto',1) | list %}
              {% if unack %}
              | When | Who | What | Where |
              |---|---|---|---|
              {% for a in unack[:15] -%}
              | {{ a.timestamp[5:16] }} | {{ a.who }} | {{ a.what }} | {{ a.location[:40] }} |
              {% endfor %}

              _Showing {{ [unack|length, 15]|min }} of {{ unack|length }} unacknowledged · {{ items|length }} total_
              {% else %}
              _No unacknowledged anomalies._
              {% endif %}

      # ----- Top routines learned -----
      - type: grid
        cards:
          - type: heading
            heading: "Top learned routines ({{ state_attr('sensor.mesh_scene_top_routines','routines') | length if state_attr('sensor.mesh_scene_top_routines','routines') else 0 }})"
            icon: mdi:repeat-variant
          - type: markdown
            content: >
              {% set rs = state_attr('sensor.mesh_scene_top_routines','routines') or [] %}
              {% set top = rs | sort(attribute='occurrences', reverse=true) %}
              {% if top %}
              | # | Pattern | Occurrences | Confidence |
              |---|---|---|---|
              {% for r in top[:15] -%}
              | {{ r.id }} | **{{ r.who }}** doing **{{ r.what }}** in *{{ r.location[:30] }}* day {{ r.day_of_week }} hour {{ r.hour }} | {{ r.occurrences }} | {{ "%.0f"|format(r.confidence*100) }}% |
              {% endfor %}

              _Showing top 15 by occurrences._
              {% else %}
              _No routines learned yet._
              {% endif %}

      # ----- Aria projects -----
      - type: grid
        cards:
          - type: heading
            heading: "Aria research ({{ states('sensor.mesh_aria_projects_total') }} projects)"
            icon: mdi:flask
          - type: markdown
            content: >
              {% set archived = state_attr('sensor.mesh_aria_projects_total','archived') or [] %}
              {% if archived %}
              | When | Status | Goal |
              |---|---|---|
              {% for p in archived[:10] -%}
              | {{ p.created_at[5:16] }} | {{ "X" if p.status=="killed" else "OK" if p.status=="complete" else p.status }} | {{ p.goal[:120] }} |
              {% endfor %}

              _Active: {{ states('sensor.mesh_aria_projects_active') }} · Archived: {{ archived|length }}_
              {% else %}
              _No aria projects yet._
              {% endif %}

      # ----- Recent council queries -----
      - type: grid
        cards:
          - type: heading
            heading: Recent council queries
            icon: mdi:account-supervisor-circle
          - type: markdown
            content: >
              {% set mem = state_attr('sensor.mesh_council_status','memory') %}
              {% set recent = mem.recent if mem else [] %}
              {% if recent %}
              | When | Query |
              |---|---|
              {% for q in recent[:10] -%}
              | {{ q.timestamp[5:16] }} | {{ q.text[:140] }}{% if q.text|length > 140 %}...{% endif %} |
              {% endfor %}

              _Cache hit ratio: {{ states('sensor.mesh_council_cache_hit_ratio') }}% · Total queries: {{ states('sensor.mesh_council_queries') }}_
              {% else %}
              _No recent queries._
              {% endif %}

  # ============================================================
  - title: Control
    path: control
    icon: mdi:gesture-tap-button
    type: sections
    max_columns: 2
    sections:
      # ----- Last action result (top, prominent) -----
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Last action result
            secondary: "{{ states('input_text.mesh_last_action_result') }}"
            icon: mdi:check-circle
            icon_color: |
              {% set s = states('input_text.mesh_last_action_result') %}
              {% if 'FAIL' in s %}red{% elif s == 'Ready' %}grey{% else %}green{% endif %}
            entity: input_text.mesh_last_action_result
            fill_container: true
            multiline_secondary: true
            card_mod:
              style: |
                ha-card {
                  border-left: 3px solid var(--primary-color);
                }

      # ----- Ask Council -----
      - type: grid
        cards:
          - type: heading
            heading: Ask Council
            icon: mdi:account-supervisor
          - type: entities
            entities:
              - entity: input_text.mesh_council_query
                name: Question
            show_header_toggle: false
          - type: custom:mushroom-template-card
            primary: "Ask"
            secondary: "Sends to Council :8800/council/ask (depth=fast). Result lands above."
            icon: mdi:send
            icon_color: indigo
            tap_action:
              action: call-service
              service: script.ask_council
            multiline_secondary: true

      # ----- Search Knowledge -----
      - type: grid
        cards:
          - type: heading
            heading: Search knowledge
            icon: mdi:database-search
          - type: entities
            entities:
              - entity: input_text.mesh_knowledge_query
                name: Search query
            show_header_toggle: false
          - type: custom:mushroom-template-card
            primary: "Search"
            secondary: "Searches {{ states('sensor.mesh_knowledge_chunks') }} chunks. Top result lands above."
            icon: mdi:magnify
            icon_color: cyan
            tap_action:
              action: call-service
              service: script.search_knowledge
            multiline_secondary: true

      # ----- Save Note -----
      - type: grid
        cards:
          - type: heading
            heading: Save note to knowledge
            icon: mdi:note-plus
          - type: entities
            entities:
              - entity: input_text.mesh_knowledge_note
                name: Note text
            show_header_toggle: false
          - type: custom:mushroom-template-card
            primary: "Save"
            secondary: "Persists to ChromaDB. Confirmation lands above."
            icon: mdi:content-save
            icon_color: green
            tap_action:
              action: call-service
              service: script.save_knowledge_note
            multiline_secondary: true

      # ----- Quick actions -----
      - type: grid
        cards:
          - type: heading
            heading: Quick actions
            icon: mdi:flash
          - type: custom:mushroom-template-card
            primary: "Re-narrate scene"
            secondary: "Forces SceneEngine to regenerate llava narrative now"
            icon: mdi:script-text
            icon_color: deep-purple
            tap_action:
              action: call-service
              service: script.refresh_scene_narrative
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: "Fire watchdog"
            secondary: "Manually trigger automation re-enable check (current count: {{ states('counter.watchdog_reenable_count') }})"
            icon: mdi:shield-refresh
            icon_color: amber
            tap_action:
              action: call-service
              service: script.fire_watchdog_reenable
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: "Quiet mode"
            secondary: "{{ 'ON - mesh muted for 8h' if is_state('input_boolean.mesh_quiet_mode','on') else 'OFF - mesh active' }}"
            icon: "{{ 'mdi:volume-off' if is_state('input_boolean.mesh_quiet_mode','on') else 'mdi:volume-high' }}"
            icon_color: "{{ 'blue' if is_state('input_boolean.mesh_quiet_mode','on') else 'green' }}"
            entity: input_boolean.mesh_quiet_mode
            tap_action:
              action: toggle
            multiline_secondary: true

  # ============================================================
  - title: System
    path: system
    icon: mdi:server
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Self-healing watchdog
            icon: mdi:shield-check
          - type: custom:mushroom-template-card
            primary: Watchdog
            secondary: "{{ states('sensor.watchdog_status') | title }} · {{ states('counter.watchdog_reenable_count') }} re-enables"
            icon: "{{ state_attr('sensor.watchdog_status','icon') }}"
            icon_color: |
              {% set s = states('sensor.watchdog_status') %}
              {% if s == 'healthy' %}green{% elif s == 'quiet' %}blue{% else %}red{% endif %}
            entity: sensor.watchdog_status
            fill_container: true
          - type: entities
            entities:
              - entity: automation.watchdog_re_enable_disabled_automation
                secondary_info: last-triggered
              - entity: automation.watchdog_force_clear_quiet_mode_after_8h
                secondary_info: last-triggered
              - entity: automation.watchdog_mesh_service_offline_alert
                secondary_info: last-triggered

      - type: grid
        cards:
          - type: heading
            heading: Mesh service health
            icon: mdi:heart-pulse
          - type: glance
            show_state: true
            columns: 3
            entities:
              - entity: binary_sensor.mesh_council_alive
                name: Council
              - entity: binary_sensor.mesh_knowledge_alive
                name: Knowledge
              - entity: binary_sensor.mesh_vision_alive
                name: Vision
              - entity: binary_sensor.mesh_scene_alive
                name: Scene
              - entity: binary_sensor.mesh_memory_alive
                name: Memory
              - entity: binary_sensor.mesh_genesis_alive
                name: Genesis

      - type: grid
        cards:
          - type: heading
            heading: All mesh metrics
            icon: mdi:chart-line
          - type: entities
            entities:
              - sensor.mesh_council_queries
              - sensor.mesh_council_cache_hit_ratio
              - sensor.mesh_knowledge_chunks
              - sensor.mesh_knowledge_files
              - sensor.mesh_vision_events
              - sensor.mesh_vision_llava_calls
              - sensor.mesh_vision_faces_enrolled
              - sensor.mesh_scene_events_today
              - sensor.mesh_scene_routines_learned
              - sensor.mesh_scene_top_routines
              - sensor.mesh_scene_anomalies_24h
              - sensor.mesh_scene_anomalies
              - sensor.mesh_sentiment_analyses
              - sensor.mesh_aria_projects_total
              - sensor.mesh_aria_projects_active

      - type: grid
        cards:
          - type: heading
            heading: Documentation
            icon: mdi:file-document
          - type: markdown
            content: |
              **Phase 5 LIVE** - auto-generated:
              - **Family manual**: `docs/family-manual.md`
              - **Technical manual**: `docs/technical-manual.md`
              - **Audit script**: `python scripts/ha_audit.py`
              - **Public repo**: [github.com/Jovian0908/home-assistant-config](https://github.com/Jovian0908/home-assistant-config)
              - **Demo transcript**: `docs/flagship-demo-transcript.md`
