# Mesh AI Renovation v2 — Lovelace Dashboard
# 6 sections, mobile-first, demonstrates the 12 HACS plugins installed in Phase 1a.
# Cards reference live mesh entities flowing in via MQTT discovery.
#
# Plugins used:
#   - bubble-card (sub-buttons, pop-up nav)
#   - mushroom (room tiles)
#   - card-mod (custom CSS polish)
#   - button-card (custom action buttons)
#   - apexcharts-card (trend charts)
#   - auto-entities (filter-driven entity lists)
#   - decluttering-card (template re-use)
#   - layout-card (custom grid)
#   - swipe-card (multi-card carousel)
#   - advanced-camera-card (Frigate timeline; needs Frigate config to populate)
#   - mini-media-player (multi-room audio)
#   - floor3d-pro-card (3D floorplan; needs floor3d model)

title: Mesh AI
views:
  # ────────────────────────────────────────────────────────────────
  - title: Home
    icon: mdi:home-variant
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Activity tier
            heading_style: title
            icon: mdi:account-clock
          - type: custom:mushroom-template-card
            primary: Mesh activity tier
            secondary: "{{ states('sensor.mesh_activity_tier') | title }}"
            icon: mdi:account-clock
            icon_color: |
              {% set t = states('sensor.mesh_activity_tier') %}
              {% if t == 'active' %}green{% elif t == 'quiet' %}blue{% elif t == 'idle' %}orange{% else %}grey{% endif %}
            tap_action:
              action: more-info
              entity: sensor.mesh_activity_tier
            entity: sensor.mesh_activity_tier

      - type: grid
        cards:
          - type: heading
            heading: Voice
            heading_style: title
            icon: mdi:microphone
          - type: custom:mushroom-template-card
            primary: Mesh AI assistant
            secondary: qwen2.5:14b · mesh_llm (12 tools)
            icon: mdi:robot-happy
            icon_color: deep-purple
            tap_action:
              action: navigate
              navigation_path: /developer-tools/yaml
          - type: markdown
            content: >
              **Try asking via voice (or HA Assist):**
              - "What's my current scene?"
              - "Search my notes for X"
              - "List my aria research"
              - "Council, should I do Y?"
              - "Save this note: ..."

      - type: grid
        cards:
          - type: heading
            heading: Now
            heading_style: title
            icon: mdi:weather-partly-cloudy
          - type: custom:mushroom-template-card
            primary: "{{ now().strftime('%A, %B %-d') }}"
            secondary: "{{ now().strftime('%I:%M %p') }}"
            icon: mdi:clock-outline
          - type: sun
            entity: sun.sun

  # ────────────────────────────────────────────────────────────────
  - title: AI Status
    icon: mdi:brain
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Conversation agents
            icon: mdi:forum
          - type: custom:auto-entities
            card:
              type: entities
              title: Active conversation agents
            filter:
              include:
                - domain: conversation

      - type: grid
        cards:
          - type: heading
            heading: Mesh service map
            icon: mdi:graph
          - type: markdown
            content: |
              **L0 Infra**  Ollama · MQTT (CM5) · Whisper · Piper

              **L1 Core**   ChromaDB · Nexus · Cache

              **L2 Intelligence**
              Orchestrator · Conversation · Energy · Presence · Routine · Scene · Notification · Sentiment · Voice · Knowledge · ActivityTier

              **L3 AI Brains**  Council · ARIA · Cortex

              **L5 Organism**  Memory · Organism · Evolution · Genesis

              **L6 Apps**   JellyTube · CoffeeBank · ChatProxy · Bridge · Open-WebUI

              **MCP Bridge** :7060 → 12 tools registered

      - type: grid
        cards:
          - type: heading
            heading: Mesh tool registry
            icon: mdi:tools
          - type: markdown
            content: |
              | Tool | Backend | Status |
              |---|---|---|
              | `mesh_council_decide` | Council :8800 | ✅ wired |
              | `mesh_knowledge_search` | Knowledge :5850 | ✅ wired |
              | `mesh_knowledge_ingest` | Knowledge :5850 | ✅ wired |
              | `mesh_scene_current` | Scene :5555 | ⚠ endpoint format |
              | `mesh_vision_describe` | Vision :6600 | ✅ wired |
              | `mesh_vision_list_recent` | Vision :6600 | ✅ wired |
              | `mesh_aria_research` | aria :5050 | ⚠ payload polish |
              | `mesh_aria_recall` | aria :5050 | ✅ wired |
              | `mesh_sentiment_analyze` | Sentiment :5800 | ✅ wired |
              | `mesh_routine_predict` | Routine :5500 | ✅ wired |
              | `mesh_memory_recall` | Memory :5950 | ✅ wired |
              | `mesh_genesis_spawn` | Genesis :6400 | ✅ wired (dry-run guard) |

  # ────────────────────────────────────────────────────────────────
  - title: Energy
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Live consumption
            icon: mdi:flash
          - type: markdown
            content: >
              **Phase 2 placeholder** — populates when EnergyBot's MQTT discovery
              lands `sensor.energy_*` entities into sandbox.

              When wired:
              - `apexcharts-card` 24h consumption stack
              - `auto-entities` plug grid (TP-Link KP125M)
              - Anomaly feed from `mesh/energy/anomaly` MQTT topic

      - type: grid
        cards:
          - type: heading
            heading: Predictive
            icon: mdi:chart-line
          - type: markdown
            content: |
              When the renovation reaches Phase 4 with Forecast.Solar + Octopus/Tibber:
              - real-time badges
              - water Sankey (HA 2026.3 native)
              - Predictive pre-heat schedule

  # ────────────────────────────────────────────────────────────────
  - title: Cameras
    icon: mdi:cctv
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Frigate
            icon: mdi:cctv
          - type: markdown
            content: >
              **Phase 3 placeholder** — when Frigate 0.16 upgrade + face recognition
              lands and the Frigate integration is added to sandbox HA, this section
              will host:

              - `custom:advanced-camera-card` v3 (timeline + face-recognized arrivals)
              - GenAI Review Summaries from Frigate 0.16
              - Mesh vision-narration overlay (mesh_vision_describe outputs)

      - type: grid
        cards:
          - type: heading
            heading: Vision recent
            icon: mdi:eye
          - type: markdown
            content: |
              `mesh/vision/<camera>/{scene,detected,flags,raw}` MQTT topics
              flow into sandbox once we add MQTT-discovery sensors per camera.

  # ────────────────────────────────────────────────────────────────
  - title: Floor3D
    icon: mdi:floor-plan
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 3D floorplan
            icon: mdi:floor-plan
          - type: markdown
            content: >
              **Phase 2c placeholder** — needs a `.glb` floorplan model
              for floor3d-pro-card. Once you provide the model file
              and entity-to-room mapping, this section hosts:

              - Live light states overlaid on rooms
              - Presence dots per FP2/FP300 zone
              - Climate temp gradient per room
              - Click area → drill to room controls

  # ────────────────────────────────────────────────────────────────
  - title: System
    icon: mdi:server
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Watchdog state
            icon: mdi:heart-pulse
          - type: custom:mushroom-template-card
            primary: Watchdog
            secondary: "{{ states('sensor.watchdog_status') | title }}"
            icon: "{{ state_attr('sensor.watchdog_status', 'icon') }}"
            icon_color: |
              {% set s = states('sensor.watchdog_status') %}
              {% if s == 'healthy' %}green{% elif s == 'quiet' %}blue{% else %}red{% endif %}
            entity: sensor.watchdog_status
          - type: entities
            title: Self-healing
            entities:
              - entity: automation.watchdog_re_enable_disabled_automation
                name: Re-enable disabled automation (every 5min)
              - entity: automation.watchdog_force_clear_quiet_mode_after_8h
                name: Quiet-mode 9h backstop
              - entity: automation.watchdog_mesh_service_offline_alert
                name: Mesh degraded alert
              - entity: counter.watchdog_reenable_count
                name: Lifetime re-enables
              - entity: input_boolean.mesh_quiet_mode
                name: Quiet mode (kill switch)

      - type: grid
        cards:
          - type: heading
            heading: Documentation
            icon: mdi:file-document
          - type: markdown
            content: |
              **Phase 5 LIVE** — basnijholt-style auto-doc shipped:
              - **Family manual**: `docs/family-manual.md` (rebuilt by `ha_doc_generator.py`)
              - **Technical manual**: `docs/technical-manual.md` (future-me reference)
              - **Audit**: `python scripts/ha_audit.py` runs find-dangling-refs + find-unused-sensors + check-repairs in one shot
              - **Flagship demo**: `docs/flagship-demo-transcript.md` (6/6 acts captured 2026-05-07)
