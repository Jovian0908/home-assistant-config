# Mesh AI Renovation v2 - Lovelace Dashboard (rebuild 2026-05-08)
#
# Real entities, real rooms, mushroom-styled. Built for CM5 (192.168.0.50:8123)
# where all 29 lights, FP2 presence, media players, and 73 Uptime Kuma
# monitors live.

title: Mesh AI
views:
  # ============================================================
  - title: Home
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 3
    sections:
      # ----- Header: time + watchdog -----
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ now().strftime('%A, %B %d') }}"
            secondary: "{{ now().strftime('%I:%M %p') }} - {{ states('weather.home') | title if states('weather.home') not in ['unknown','unavailable'] else 'Home' }}"
            icon: mdi:weather-partly-cloudy
            icon_color: amber
            fill_container: true
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: Watchdog
            secondary: "{{ states('sensor.watchdog_status') | title }} - {{ states('counter.watchdog_reenable_count') }} re-enables"
            icon: "{{ state_attr('sensor.watchdog_status','icon') }}"
            icon_color: |
              {% set s = states('sensor.watchdog_status') %}
              {% if s == 'healthy' %}green{% elif s == 'quiet' %}blue{% else %}red{% endif %}
            entity: sensor.watchdog_status
            fill_container: true

      # ----- Presence map (FP2 zones) -----
      - type: grid
        cards:
          - type: heading
            heading: Presence
            icon: mdi:radar
          - type: custom:mushroom-template-card
            primary: Living room
            secondary: "{{ 'Occupied' if is_state('binary_sensor.fp2_living_room_presence','on') else 'Empty' }}"
            icon: mdi:sofa
            icon_color: "{{ 'amber' if is_state('binary_sensor.fp2_living_room_presence','on') else 'grey' }}"
            entity: binary_sensor.fp2_living_room_presence
          - type: custom:mushroom-template-card
            primary: Kitchen
            secondary: "{{ 'Occupied' if is_state('binary_sensor.fp2_kitchen_presence','on') else 'Empty' }}"
            icon: mdi:silverware-fork-knife
            icon_color: "{{ 'amber' if is_state('binary_sensor.fp2_kitchen_presence','on') else 'grey' }}"
            entity: binary_sensor.fp2_kitchen_presence
          - type: custom:mushroom-template-card
            primary: Hallway
            secondary: "{{ 'Occupied' if is_state('binary_sensor.fp2_hallway_presence','on') else 'Empty' }}"
            icon: mdi:walk
            icon_color: "{{ 'amber' if is_state('binary_sensor.fp2_hallway_presence','on') else 'grey' }}"
            entity: binary_sensor.fp2_hallway_presence
          - type: custom:mushroom-template-card
            primary: Office
            secondary: "{{ 'Occupied' if is_state('binary_sensor.fp2_office_presence','on') else 'Empty' }}"
            icon: mdi:desk
            icon_color: "{{ 'amber' if is_state('binary_sensor.fp2_office_presence','on') else 'grey' }}"
            entity: binary_sensor.fp2_office_presence
          - type: custom:mushroom-template-card
            primary: Dining
            secondary: "{{ 'Occupied' if is_state('binary_sensor.fp2_dining_presence','on') else 'Empty' }}"
            icon: mdi:silverware
            icon_color: "{{ 'amber' if is_state('binary_sensor.fp2_dining_presence','on') else 'grey' }}"
            entity: binary_sensor.fp2_dining_presence
          - type: custom:mushroom-template-card
            primary: Master bedroom
            secondary: "{{ 'Occupied' if is_state('binary_sensor.master_bedroom_presence','on') else 'Empty' }}"
            icon: mdi:bed
            icon_color: "{{ 'amber' if is_state('binary_sensor.master_bedroom_presence','on') else 'grey' }}"
            entity: binary_sensor.master_bedroom_presence

      # ----- Media (now playing) -----
      - type: grid
        cards:
          - type: heading
            heading: Media
            icon: mdi:music
          - type: custom:auto-entities
            card:
              type: vertical-stack
            filter:
              include:
                - domain: media_player
                  state: playing
                  options:
                    type: custom:mini-media-player
                    artwork: cover
                    info: scroll
                    hide:
                      power: false
                      source: false
            sort:
              method: friendly_name
            show_empty: false

  # ============================================================
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Kitchen
            icon: mdi:silverware-fork-knife
          - type: custom:mushroom-light-card
            entity: light.kitchen_light
            show_brightness_control: true
            show_color_temp_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.kitchen_overhead
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.kitchen_counter
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.counter_lights
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.hoodfan_light
            show_brightness_control: true
            collapsible_controls: true

      - type: grid
        cards:
          - type: heading
            heading: Bedroom and bath
            icon: mdi:bed
          - type: custom:mushroom-light-card
            entity: light.bedroom_light
            show_brightness_control: true
            show_color_temp_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.bathroom_lights
            show_brightness_control: true
            collapsible_controls: true

      - type: grid
        cards:
          - type: heading
            heading: Hall, entry, dining
            icon: mdi:home
          - type: custom:mushroom-light-card
            entity: light.hall_light
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.entry_light
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.diningroom_lamp
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.lamps
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.door_light
            show_brightness_control: true
            collapsible_controls: true

  # ============================================================
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Living room (Tapo C260)
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.tapo_c260
            show_state: false
            show_name: false
            camera_view: live
          - type: heading
            heading: Front door (G410)
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.g410_front
            show_state: false
            show_name: false
            camera_view: live

  # ============================================================
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              ## Native energy dashboard

              The full energy view (Sankey, sources, daily breakdown) lives at:

              **[/energy](/energy)** - HA's first-party energy dashboard

              Already wired with grid + electricity tracking from your recorder.

      - type: grid
        cards:
          - type: heading
            heading: Smart plugs
            icon: mdi:power-socket
          - type: custom:auto-entities
            card:
              type: glance
              show_state: true
              show_name: true
            filter:
              include:
                - entity_id: switch.kasa_*
                - entity_id: switch.kp125m_*
                - entity_id: switch.tp_link*
            sort:
              method: friendly_name
            show_empty: false

  # ============================================================
  - title: System
    path: system
    icon: mdi:server
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Self-healing
            icon: mdi:shield-check
          - type: custom:mushroom-template-card
            primary: Watchdog
            secondary: "{{ states('sensor.watchdog_status') | title }} - {{ states('counter.watchdog_reenable_count') }} lifetime re-enables"
            icon: "{{ state_attr('sensor.watchdog_status','icon') }}"
            icon_color: |
              {% set s = states('sensor.watchdog_status') %}
              {% if s == 'healthy' %}green{% elif s == 'quiet' %}blue{% else %}red{% endif %}
            entity: sensor.watchdog_status
            fill_container: true
          - type: entities
            entities:
              - entity: automation.watchdog_re_enable_disabled_automation
                name: Re-enable disabled automation
                secondary_info: last-triggered
              - entity: automation.watchdog_force_clear_quiet_mode_after_8h
                name: Quiet-mode 9h backstop
                secondary_info: last-triggered
              - entity: automation.watchdog_mesh_service_offline_alert
                name: Mesh-degraded alert
                secondary_info: last-triggered
              - entity: input_boolean.mesh_quiet_mode
                name: Quiet mode (kill switch)

      - type: grid
        cards:
          - type: heading
            heading: Service uptime (Uptime Kuma)
            icon: mdi:heart-pulse
          - type: custom:auto-entities
            card:
              type: glance
              show_state: true
              columns: 4
            filter:
              include:
                - entity_id: sensor.*_uptime_1_day
            sort:
              method: state
              numeric: true
              reverse: false
            show_empty: false

      - type: grid
        cards:
          - type: heading
            heading: Documentation
            icon: mdi:file-document
          - type: markdown
            content: |
              **Phase 5 LIVE** - auto-generated:
              - **Family manual**: `docs/family-manual.md`
              - **Technical manual**: `docs/technical-manual.md`
              - **Audit**: `python scripts/ha_audit.py`
              - **Public repo**: [github.com/Jovian0908/home-assistant-config](https://github.com/Jovian0908/home-assistant-config)
              - **Demo transcript**: `docs/flagship-demo-transcript.md`
