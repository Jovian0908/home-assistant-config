# CI - Frenck pattern: matrix `ha core check` against stable / beta / dev,
# plus actionlint + zizmor security scan + custom_components syntax validation.
#
# Pinned action SHAs are the security baseline; bump deliberately, not
# automatically, after reviewing the upstream changelog.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:14 UTC - catches HA dev-channel breaking changes early.
    - cron: "14 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ha-core-check:
    name: HA core check (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [stable, beta, dev]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Substitute fake secrets for CI
        run: cp secrets.fake.yaml secrets.yaml

      - name: Run HA core check (${{ matrix.version }})
        uses: frenck/action-home-assistant@941d5d917f4c1c7a7e7d4087526daf90d53f4437 # v1.4.1
        with:
          path: "."
          secrets: secrets.fake.yaml
          version: ${{ matrix.version }}

  python-lint:
    name: Python lint (ruff + py syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.7.4

      - name: ruff check
        run: ruff check custom_components scripts

      - name: ruff format --check
        run: ruff format --check custom_components scripts

      - name: Compile-check all Python files
        run: |
          python -m compileall -q custom_components scripts

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          config_file: .yamllint
          file_or_dir: |
            packages
            dashboards
            automations.yaml
            configuration.yaml

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.4
        with:
          args: -color

  zizmor:
    name: zizmor security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
